[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proto2prod"
version = "0.1.0"
description = "Multi-agent AI that turns a prototype web app into a verified, production-ready AWS deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/proto2prod"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
